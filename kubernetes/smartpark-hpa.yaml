apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartpark-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartpark-api
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
